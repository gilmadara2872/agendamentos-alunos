# Docker Compose - VM Oracle Cloud (Always Free)
# PostgreSQL local + Flask + Next.js + n8n
# Tudo roda 24h sem hibernar na VM
version: '3.8'

services:
  # ===========================================
  # BANCO DE DADOS POSTGRESQL (LOCAL)
  # ===========================================
  postgres:
    image: postgres:16-alpine
    container_name: agendamento-db
    environment:
      - POSTGRES_USER=agendamento
      - POSTGRES_PASSWORD=AgendamentoADS2026@#
      - POSTGRES_DB=agendamento
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agendamento"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # BACKEND FLASK
  # ===========================================
  backend:
    build:
      context: .
      dockerfile: railway/Dockerfile.backend
    container_name: agendamento-api
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://agendamento:AgendamentoADS2026@#@postgres:5432/agendamento
      - JWT_SECRET=agendamento-jwt-secret-2026-vinicius
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # FRONTEND NEXT.JS
  # ===========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agendamento-web
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # ===========================================
  # N8N (AUTOMACAO)
  # ===========================================
  n8n:
    image: n8nio/n8n:latest
    container_name: agendamento-n8n
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - WEBHOOK_URL=http://localhost:5678/
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=agendamento
      - DB_POSTGRESDB_USER=agendamento
      - DB_POSTGRESDB_PASSWORD=AgendamentoADS2026@#
    ports:
      - "5678:5678"
    volumes:
      - ./n8n:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ===========================================
  # BACKUP AUTOMATICO
  # ===========================================
  backup:
    image: postgres:16-alpine
    container_name: agendamento-backup
    environment:
      - PGPASSWORD=AgendamentoADS2026@#
    volumes:
      - ./backups:/backups
    command: >
      sh -c "
        echo '0 3 * * * pg_dump -h postgres -U agendamento agendamento > /backups/backup_$$(date +\%Y\%m\%d_\%H\%M\%S).sql' | crontab - && crond -f
      "
    depends_on:
      - postgres
    restart: unless-stopped
